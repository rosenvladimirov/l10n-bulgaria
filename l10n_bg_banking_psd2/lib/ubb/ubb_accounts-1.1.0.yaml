  /:
    get:
      operationId: getAccountList
      description: Read the identifiers of the available payment account together with booking balance information, depending on the consent granted. It is assumed that a consent of the PSU to this access is already given and stored on the ASPSP system. The addressed list of accounts depends then on the PSU ID and the stored consent addressed by consentId, respectively the OAuth2 access token.                   Returns all identifiers of the accounts, to which an account access has been granted to through the /consents endpoint by the PSU. In addition, relevant information about the accounts and hyperlinks to corresponding account information resources are provided if a related consent has been already granted.
      summary: Read Account List
      parameters:
        - name: withBalance
          in: query
          required: false
          description: If contained, this function reads the list of accessible payment accounts including the booking balance, if granted by the PSU in the related consent and available by the ASPSP. This parameter might be ignored by the ASPSP.
          type: boolean
        - name: X-Request-ID
          in: header
          required: true
          description: ID of the request, unique to the call, as determined by the initiating party.
