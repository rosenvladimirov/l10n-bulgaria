swagger: '2.0'
info:
  title: Accounts
  x-ibm-name: accounts
  version: 1.1.0
  description: API for PSD2 Account Information Product
host: api.ubb.bg
schemes:
  - https
basePath: /ubb-sb/psd2/v1/accounts
produces: []
consumes: []
security:
  - oauth:
      - sandbox.PSP_AI
securityDefinitions:
  oauth:
    type: oauth2
    description: Oauth Authentication
    flow: application
    x-ibm-oauth-provider: oauther
    tokenUrl: /oauther/oauth2/token
    scopes:
      sandbox.PSP_AI: View account information
  clientSecret:
    type: apiKey
    description: Client Secret
    name: X-IBM-Client-Secret
    in: header
  clientID:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  phase: realized
  testable: true
  enforced: true
  cors:
    enabled: true
  application-authentication:
    certificate: true
  type: rest
  servers:
    - url: https://api.ubb.bg/ubb-sb/psd2/v1/accounts
      description: ''
      type:
        - production
        - development
  oauth-servers:
    oauth:
      tokenUrls:
        - https://api.ubb.bg/ubb-sb/psd2/oauther/oauth2/token
      authorizationUrls: []
      refreshUrls: []
definitions:
  readAccountListResponse:
    type: object
    properties:
      accounts:
        type: array
        items:
          $ref: '#/definitions/accountsDetailsReference'
        example:
          - resourceId: 3dc3d5b3-7023-4848-9853-f5400a64e80f
            iban: BG94BANK12341234567890
            currency: BGN
            product: Checking account
            cashAccountType: CurrentAccount
            name: Main Account
            _links:
              balances:
                href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e80f/balances
              transactions:
                href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e80f/transactions
          - resourceId: 3dc3d5b3-7023-4848-9853-f5400a64e81g
            iban: BG96BGBK43210123456789
            currency: USD
            product: Foreign currency account
            cashAccountType: CurrentAccount
            name: US Dollar Account
            _links:
              balances:
                href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e81g/balances
    description: Successful response for Read Account List API.
    additionalProperties: false
    required:
      - accounts
  accountsDetailsReference:
    type: object
    properties:
      resourceId:
        description: This is the data element to be used in the path when retrieving data from a dedicated account. This shall be filled, if addressable resource are created by the ASPSP on the /accounts or /card-accounts endpoint.
        $ref: '#/definitions/resourceId'
      iban:
        description: This data element can be used in the body of the Consent Request Message for retrieving account access consent from this payment account
        $ref: '#/definitions/iban'
      bban:
        description: This data element can be used in the body of the Consent Request Message for retrieving account access consent from this account. This data elements is used for payment accounts which have no IBAN.
        $ref: '#/definitions/bban'
      pan:
        description: Primary Account Number (PAN) of a card, can be tokenized by the ASPSP due to PCI DSS requirements. This data element can be used in the body of the Consent Request Message for retrieving account access consent from this card
        $ref: '#/definitions/pan'
      maskedPan:
        $ref: '#/definitions/maskedPan'
        description: Primary Account Number (PAN) of a card in masked form. This data element can be used in the body of the Consent Request Message for retrieving account access consent from this card
      msisdn:
        description: An alias to access a payment account via a registered mobile phone number. This alias might be needed e.g. in the payment initiation service.The support of this alias must be explicitly documented by the ASPSP for the corresponding API Calls.
        $ref: '#/definitions/msisdn'
      currency:
        description: Account currency
        $ref: '#/definitions/currency'
      name:
        type: string
        description: Name of the account given by the bank or the PSU in Online-Banking
      product:
        type: string
        description: Product Name of the Bank for this account, proprietary definition
      cashAccountType:
        description: ExternalCashAccountType1Code from ISO 20022
        $ref: '#/definitions/cashAccountType'
      bic:
        $ref: '#/definitions/bicfi'
        description: The BIC associated to the account.
      linkedAccounts:
        description: Case of a set of pending card transactions, the APSP will provide the relevant cash account the card is set up on.
        $ref: '#/definitions/linkedAccounts'
      usage:
        description: 'Specifies the usage of the account - PRIV: private personal account - ORGA: professional account'
        $ref: '#/definitions/usage'
      details:
        description: Specifications that might be provided by the ASPSP - characteristics of the account - characteristics of the relevant card
        $ref: '#/definitions/details'
      balances:
        type: array
        description: Array of Balances
        items:
          $ref: '#/definitions/balanceRef'
      _links:
        description: Links to the account, which can be directly used for retrieving account information from this dedicated account. Links to "balances" and/or "transactions" These links are only supported, when the corresponding consent has been already granted.
        $ref: '#/definitions/_links'
    description: 'The ASPSP shall give at least one of the account reference identifiers: - iban - bban - pan - maskedPan - msisdn If the account is a multicurrency account currency code in "currency" is set to "XXX".'
    example:
      resourceId: 3dc3d5b3-7023-4848-9853-f5400a64e80f
      iban: BG94BANK12341234567890
      currency: BGN
      product: Checking Account
      cashAccountType: CurrentAccount
      name: Main Account
      _links:
        balances:
          href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e80f/balances
        transactions:
          href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e80f/transactions
    additionalProperties: false
    required:
      - currency
  resourceId:
    type: string
    example: 3dc3d5b3-7023-4848-9853-f5400a64e80f
    description: This shall be filled, if addressable resource are created by the ASPSP on the /accounts or /card-accounts endpoint.
  iban:
    type: string
    description: IBAN of an account
    pattern: '[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}'
    example: BG94BANK12341234567890
  bban:
    type: string
    description: Basic Bank Account Number (BBAN) Identifier. This data element can be used in the body of the Consent Request Message for retrieving Account access Consent from this Account. Thisdata elements is used for payment Accounts which have no IBAN.
    pattern: '[a-zA-Z0-9]{1,30}'
    example: BARC12345612345678
  pan:
    type: string
    maxLength: 35
    description: Primary Account Number according to ISO/IEC 7812.
    example: '5409050000000000'
  maskedPan:
    type: string
    maxLength: 35
    description: Masked Primary Account Number
    example: 123456xxxxxx1234
  msisdn:
    type: string
    maxLength: 35
    description: Mobile phone number.
    example: +359 898 888888
  currency:
    type: string
    pattern: '[A-Z]{3}'
    description: ISO 4217 Alpha 3 currency code
    example: BGN
  cashAccountType:
    type: string
    description: ExternalCashAccountType1Code from ISO 20022. Possible value - CACC, CASH, CHAR, CISH, COMM, CPAC, LLSV, LOAN, MGLD, MOMA, NREX, ODFT, ONDP, OTHR, SACC, SLRY, SVGS, TAXE, TRAN, TRAS
    enum:
      - CACC
      - CASH
      - CHAR
      - CISH
      - COMM
      - CPAC
      - LLSV
      - LOAN
      - MGLD
      - MOMA
      - NREX
      - ODFT
      - ONDP
      - OTHR
      - SACC
      - SLRY
      - SVGS
      - TAXE
      - TRAN
      - TRAS
  bicfi:
    type: string
    pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
    description: The BIC associated to the account.
    example: AAAADEBBXXX
  linkedAccounts:
    type: string
    maxLength: 70
    description: Case of a set of pending card transactions, the APSP will provide the relevant cash account the card is set up on.
  usage:
    type: string
    maxLength: 140
    description: 'Specifies the usage of the account - PRIV: private personal account - ORGA: professional account'
    enum:
      - PRIV
      - ORGA
  details:
    type: string
    maxLength: 140
    description: Specifications that might be provided by the ASPSP - characteristics of the account - characteristics of the relevant card
  balanceRef:
    type: object
    properties:
      balanceAmount:
        $ref: '#/definitions/amountReference'
      balanceType:
        $ref: '#/definitions/balanceType'
      lastChangeDateTime:
        description: This data element might be used to indicate e.g. with the expected or booked balance that no action is known on the account, which is not yet booked.
        $ref: '#/definitions/lastChangeDateTime'
      referenceDate:
        description: reference date of the balance
        $ref: '#/definitions/referenceDate'
      lastCommittedTransaction:
        $ref: '#/definitions/lastCommittedTransaction'
        description: entryReference of the last commited transaction to support the TPP in identifying whether all PSU transactions are already known.
    description: A single balance element
    additionalProperties: false
    required:
      - balanceAmount
      - balanceType
  amountReference:
    type: object
    properties:
      currency:
        example: EUR
        description: ISO 4217 Alpha 3 currency code
        $ref: '#/definitions/currency'
      amount:
        example: '5877.78'
        description: The amount given with fractional digits, where fractions must be compliant to the currency definition.         Up to 14 significant figures. Negative amounts are signed by minus. The decimal separator is a dot.
        $ref: '#/definitions/amount'
    description: Amount object
    additionalProperties: false
    required:
      - currency
      - amount
  amount:
    type: string
    description: The amount given with fractional digits, where fractions must be compliant to the currency definition.  Up to 14 significant figures. Negative amounts are signed by minus. The decimal separator is a dot.
  balanceType:
    type: string
    description: 'The following balance types are defined: - closingBooked - Balance of the account at the end of the pre-agreed account reporting period. It is the sum of the opening booked balance at the beginning of the period and all entries booked to the account during the pre-agreed account reporting period. - expected - Balance composed of booked entries and pending items known at the time of calculation, which projects the end of day balance if everything is booked on the account and no other entry is posted. - authorised - The expected balance together with the value of a pre-approved credit line the ASPSP makes permanently available to the user. - openingBooked - Book balance of the account at the beginning of the account reporting period. It always equals the closing book balance from the previous report. - interimAvailable - Available balance calculated in the course of the account servicer''s business day, at the time specified, and subject to further changes during the business day. The interim balance is calculated on the basis of booked credit and debit items during the calculation time/period specified. - forwardAvailable - Forward available balance of money that is at the disposal of the account owner on the date specified.'
    enum:
      - closingBooked
      - expected
      - authorised
      - openingBooked
      - interimAvailable
      - forwardAvailable
  lastChangeDateTime:
    type: string
    format: date-time
    description: This data element might be used to indicate e.g. with the expected or booked balance that no action is known on the account, which is not yet booked.
  referenceDate:
    type: string
    format: date
    description: Reference date of the balance
  lastCommittedTransaction:
    type: string
    description: entryReference of the last commited transaction to support the TPP in identifying whether all PSU transactions are already known.
  _links:
    properties:
      scaRedirect:
        $ref: '#/definitions/hrefType'
        description: A link to an ASPSP site where SCA is performed within the Redirect SCA approach.
      scaOAuth:
        description: The link refers to a JSON document specifying the OAuth details of the ASPSP's authorisation server. JSON document follows the definition given in https://tools.ietf.org/html/draft-ietf-oauth-discovery.
        $ref: '#/definitions/hrefType'
      updatePsuIdentification:
        description: The link to the payment initiation or account information resource, which needs to be updated by the PSU identification if not delivered yet.
        $ref: '#/definitions/hrefType'
      updateProprietaryData:
        description: The link to the payment initiation or account information resource, which needs to be updated by the proprietary data.
        $ref: '#/definitions/hrefType'
      updatePsuAuthentication:
        description: The link to the payment initiation or account information resource, which needs to be updated by a PSU password and eventually the PSU identification if not delivered yet.
        $ref: '#/definitions/hrefType'
      selectAuthenticationMethod:
        description: This is a link to a resource, where the TPP can select the applicable second factor authentication methods for the PSU, if there were several available authentication methods.
        $ref: '#/definitions/hrefType'
      authoriseTransaction:
        description: The link to the payment initiation or consent resource, where the "Transaction Authorisation"Request" is sent to. This is the link to the resource which will authorise the payment or the consent by checking the SCA authentication data within the Embedded SCA approach.
        $ref: '#/definitions/hrefType'
      self:
        description: The link to the payment initiation resource created by the request itself. This link can be used later to retrieve the transaction status of the payment initiation.
        $ref: '#/definitions/hrefType'
      status:
        description: Status of the resource.
        $ref: '#/definitions/hrefType'
      account:
        description: A link to the resource providing the details of one account
        $ref: '#/definitions/hrefType'
      balances:
        description: A link to the resource providing the balance of a dedicated account.
        $ref: '#/definitions/hrefType'
      transactions:
        description: A link to the resource providing the transaction history of a dedicated account.
        $ref: '#/definitions/hrefType'
      transactionDetails:
        description: A link to the resource providing details of a dedicated transaction.
        $ref: '#/definitions/hrefType'
      first:
        description: Navigation link for paginated account reports.
        $ref: '#/definitions/hrefType'
      next:
        description: Navigation link for paginated account reports.
        $ref: '#/definitions/hrefType'
      previous:
        description: Navigation link for paginated account reports.
        $ref: '#/definitions/hrefType'
      last:
        description: Navigation link for paginated account reports.
        $ref: '#/definitions/hrefType'
      download:
        description: Download link for huge AIS data packages.
        $ref: '#/definitions/hrefType'
    description: A list of hyperlinks to be recognised by the TPP. The actual hyperlinks used in the response depend on the dynamical decisions of the ASPSP when processing the request.
    additionalProperties: false
  hrefType:
    properties:
      href:
        type: string
        example: /v1/payments/eur-credit-transfers/1234-wertiq-983
    additionalProperties: false
    description: Link to a resource
    required:
      - href
  getBalancesResponse:
    type: object
    properties:
      account:
        $ref: '#/definitions/account'
        description: 'Identifier of the addressed account. Remark for Future: It is recommended to use this data element. The condition might change to "mandatory" in a next version of the specification.'
      balances:
        type: array
        description: A list of balances regarding this account, e.g. the current balance, the last booked balance.
        items:
          $ref: '#/definitions/balanceRef'
    additionalProperties: false
    description: Successful response for Get Balances Service
    required:
      - balances
    example:
      account:
        iban: BG94BANK12341234567890
      balances:
        - balanceType: closingBooked
          balanceAmount:
            currency: BGN
            amount: '500.00'
          referenceDate: '2017-10-25'
        - balanceType: expected
          balanceAmount:
            currency: EUR
            amount: '900.00'
          referenceDate: '2017-10-25'
  account:
    type: object
    properties:
      iban:
        $ref: '#/definitions/iban'
      bban:
        $ref: '#/definitions/bban'
      pan:
        $ref: '#/definitions/pan'
      maskedPan:
        $ref: '#/definitions/maskedPan'
      msisdn:
        $ref: '#/definitions/msisdn'
      currency:
        $ref: '#/definitions/currency'
    description: Account reference
    example:
      iban: DE23100120020123456789
      currency: EUR
    additionalProperties: false
  getTransactionListResponse:
    type: object
    properties:
      account:
        description: 'Identifier of the addressed account. Remark for Future: It is recommended to use this data element. The condition might change to "mandatory" in a next version of the specification.'
        $ref: '#/definitions/account'
      transactions:
        description: JSON based account report.
        $ref: '#/definitions/accountReport'
      balances:
        description: A list of balances regarding this account, which might be restricted to the current balance.
        type: array
        items:
          $ref: '#/definitions/balanceRef'
      _links:
        description: 'A list of hyperlinks to be recognised by the TPP. Type of links admitted in this response: "download": a link to a resource, where the transaction report might be downloaded from in case where transaction reports have a huge size. Remark: This feature shall only be used where camt-data is requested which has a huge size.'
        $ref: '#/definitions/_links'
    description: Successful response for Get Transaction List
    additionalProperties: false
    example:
      account:
        iban: BG94BANK12341234567890
      transactions:
        booked:
          - transactionId: '1234567'
            creditorName: Ivan Ivanov
            creditorAccount:
              iban: BG94BANK12341234567890
            transactionAmount:
              currency: BGN
              amount: '256.67'
            bookingDate: '2017-10-25'
            valueDate: '2017-10-26'
            remittanceInformationUnstructured: Example 1
          - transactionId: '1234568'
            debtorName: Petar Petrov
            debtorAccount:
              iban: BG96BGBK43210123456789
            transactionAmount:
              currency: BGN
              amount: '256.67'
            bookingDate: '2017-10-25'
            valueDate: '2017-10-26'
            remittanceInformationUnstructured: Example 2
        pending:
          - transactionId: '1234569'
            creditorName: Georgi Georgiev
            creditorAccount:
              iban: BG86BGBK89514756354877
            transactionAmount:
              currency: BGN
              amount: '256.67'
            bookingDate: '2017-10-25'
            valueDate: '2017-10-26'
            remittanceInformationUnstructured: Example 1
        _links:
          account:
            href: /v1/accounts/3dc3d5b3-7023-4848-9853-f5400a64e80f
  accountReport:
    type: object
    properties:
      booked:
        type: array
        items:
          $ref: '#/definitions/transactions'
      pending:
        type: array
        items:
          $ref: '#/definitions/transactions'
      _links:
        $ref: '#/definitions/_links'
    description: JSON based account report.
    additionalProperties: false
    required:
      - _links
      - booked
  transactions:
    type: object
    properties:
      transactionId:
        description: the Transaction Id can be used as access-ID in the API, where more details on an transaction is offered.
        type: string
      entryReference:
        type: string
        description: Is the identification of the transaction as used e.g. for reference for deltafunction on application level.
      endToEndId:
        type: string
        description: Unique end to end identity
      mandateId:
        type: string
        description: Identification of Mandates, e.g. a SEPA Mandate ID.
      checkId:
        type: string
        description: Identification of a Cheque.
      creditorId:
        type: string
        description: Identification of Creditors, e.g. a SEPA Creditor ID.
      bookingDate:
        type: string
        format: date
      valueDate:
        description: The Date at which assets become available to the account owner in case of a credit.
        type: string
        format: date
      transactionAmount:
        $ref: '#/definitions/amountReference'
      exchangeRate:
        type: array
        items:
          $ref: '#/definitions/exchangeRate'
      creditorName:
        $ref: '#/definitions/creditorName'
      creditorAccount:
        $ref: '#/definitions/account'
      ultimateCreditor:
        type: string
      debtorName:
        $ref: '#/definitions/debitorName'
      debtorAccount:
        $ref: '#/definitions/account'
      ultimateDebtor:
        $ref: '#/definitions/ultimateDebtor'
      remittanceInformationUnstructured:
        type: string
      remittanceInformationStructured:
        type: string
      purposeCode:
        $ref: '#/definitions/purposeCode'
      bankTransactionCode:
        type: string
      proprietaryBankTransactionCode:
        type: string
      _links:
        $ref: '#/definitions/_links'
    description: Transaction details
    additionalProperties: false
    required:
      - transactionAmount
  exchangeRate:
    type: object
    properties:
      currencyFrom:
        $ref: '#/definitions/currency'
      rateFrom:
        type: string
      currencyTo:
        $ref: '#/definitions/currency'
      rateTo:
        type: string
      rateDate:
        type: string
        format: date
      rateContract:
        type: string
    description: Exchange Rate
    additionalProperties: false
  creditorName:
    type: string
    maxLength: 70
    description: Creditor Name
    example: Joe Doe
  debitorName:
    type: string
    description: Debtor Name
    example: Debtor Name
  ultimateDebtor:
    description: Ultimate Debtor
    type: string
    maxLength: 70
    example: Ultimate Debtor
  purposeCode:
    type: string
    minLength: 4
    maxLength: 4
    description: ExternalPurpose1Code from ISO 20022. Possible values - BONU,CASH,CBLK,CCRD,CORT,DCRD,DIVI,DVPM,EPAY,FCOL,GOVT,HEDG,ICCP,IDCP,INTC,INTE,LOAN,MP2B,MP2P,OTHR,PENS,RRCT,RVPM,SALA,SECU,SSBE,SUPP,TAXS,TRAD,TREA,VATX,WHLD
    enum:
      - GOVT
      - BONU
      - CASH
      - CBLK
      - CCRD
      - CORT
      - DCRD
      - DIVI
      - DVPM
      - EPAY
      - FCOL
      - HEDG
      - ICCP
      - IDCP
      - INTC
      - INTE
      - LOAN
      - MP2B
      - MP2P
      - OTHR
      - PENS
      - RRCT
      - RVPM
      - SALA
      - SECU
      - SSBE
      - SUPP
      - TAXS
      - TRAD
      - TREA
      - VATX
      - WHLD
  getTransactionDetailsResponse:
    type: object
    properties:
      transactionsDetails:
        $ref: '#/definitions/transactions'
    additionalProperties: false
    description: Successful response for the get transaction details service
    example:
      transactionsDetails:
        transactionId: '1234567'
        creditorName: John Miles
        creditorAccount:
          iban: BG94BANK12341234567890
        mandateId: Mandate-2018-04-20-1234
        transactionAmount:
          currency: BGN
          amount: '-256.67'
        bookingDate: '2017-10-25'
        valueDate: '2017-10-26'
        remittanceInformationUnstructured: Example 1
        bankTransactionCode: PMNT-RCVD-ESDD
  BAD_REQUEST_400:
    type: object
    properties:
      tppMessages:
        type: array
        items:
          type: object
          properties:
            category:
              $ref: '#/definitions/tppMessageCategory'
            code:
              type: string
              enum:
                - FORMAT_ERROR
                - PARAMETER_NOT_SUPPORTED
                - SERVICE_INVALID
                - RESOURCE_UNKNOWN
                - RESOURCE_EXPIRED
                - TIMESTAMP_INVALID
                - PERIOD_INVALID
                - SCA_METHOD_UNKNOWN
                - CONSENT_UNKNOWN
                - SESSIONS_NOT_SUPPORTED
              example: FORMAT_ERROR
            path:
              type: string
            text:
              $ref: '#/definitions/tppMessageText'
          additionalProperties: false
          required:
            - category
            - code
    description: Bad Request
    additionalProperties: false
    required:
      - tppMessages
  UNAUTHORIZED_401:
    type: object
    properties:
      tppMessages:
        type: array
        items:
          type: object
          properties:
            category:
              $ref: '#/definitions/tppMessageCategory'
            code:
              type: string
              enum:
                - CERTIFICATE_INVALID
                - CERTIFICATE_EXPIRED
                - CERTIFICATE_BLOCKED
                - CERTIFICATE_REVOKED
                - CERTIFICATE_MISSING
                - SIGNATURE_INVALID
                - SIGNATURE_MISSING
                - PSU_CREDENTIALS_INVALID
                - CORPORATE_ID_INVALID
                - CONSENT_INVALID
                - CONSENT_EXPIRED
                - TOKEN_UNKNOWN
                - TOKEN_INVALID
                - TOKEN_EXPIRED
              example: TOKEN_EXPIRED
            path:
              type: string
            text:
              $ref: '#/definitions/tppMessageText'
          additionalProperties: false
          required:
            - category
            - code
    description: Unauthorized
    additionalProperties: false
    required:
      - tppMessages
  FORBIDDEN_403:
    type: object
    properties:
      tppMessages:
        type: array
        items:
          type: object
          properties:
            category:
              $ref: '#/definitions/tppMessageCategory'
            code:
              type: string
              enum:
                - SERVICE_BLOCKED
                - CONSENT_UNKNOWN
                - RESOURCE_UNKNOWN
                - RESOURCE_EXPIRED
              example: CONSENT_UNKNOWN
            path:
              type: string
            text:
              $ref: '#/definitions/tppMessageText'
          additionalProperties: false
          required:
            - category
            - code
    description: Forbidden
    additionalProperties: false
    required:
      - tppMessages
  NOT_FOUND_404:
    type: object
    properties:
      tppMessages:
        type: array
        items:
          type: object
          properties:
            category:
              $ref: '#/definitions/tppMessageCategory'
            code:
              type: string
              enum:
                - RESOURCE_UNKNOWN
            path:
              type: string
            text:
