<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="280" height="280" rx="48" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 70 H280 M0 140 H280 M0 210 H280 M70 0 V280 M140 0 V280 M210 0 V280"/>
  </g>

  <!-- Connection lines from central core to 4 printer nodes -->
  <g stroke="rgba(251,191,36,0.55)" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="140" y1="140" x2="60"  y2="60"/>
    <line x1="140" y1="140" x2="220" y2="60"/>
    <line x1="140" y1="140" x2="60"  y2="220"/>
    <line x1="140" y1="140" x2="220" y2="220"/>
  </g>

  <!-- Pulse rings around the central core -->
  <g fill="none" stroke="rgba(251,191,36,0.35)">
    <circle cx="140" cy="140" r="38" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="56" stroke-width="1"/>
  </g>

  <!-- Fiscal-printer node — top-left -->
  <g filter="url(#soft)" transform="translate(28 28)">
    <rect x="0" y="14" width="64" height="40" rx="6" fill="url(#paper)"/>
    <rect x="6" y="0"  width="52" height="14" rx="3" fill="#fafafa" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="28" x2="54" y2="28" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="56" cy="46" r="3" fill="#22c55e"/>
  </g>

  <!-- Fiscal-printer node — top-right -->
  <g filter="url(#soft)" transform="translate(188 28)">
    <rect x="0" y="14" width="64" height="40" rx="6" fill="url(#paper)"/>
    <rect x="6" y="0"  width="52" height="14" rx="3" fill="#fafafa" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="28" x2="54" y2="28" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="56" cy="46" r="3" fill="#22c55e"/>
  </g>

  <!-- Fiscal-printer node — bottom-left -->
  <g filter="url(#soft)" transform="translate(28 188)">
    <rect x="0" y="14" width="64" height="40" rx="6" fill="url(#paper)"/>
    <rect x="6" y="0"  width="52" height="14" rx="3" fill="#fafafa" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="28" x2="54" y2="28" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="56" cy="46" r="3" fill="#ef4444"/>
  </g>

  <!-- Fiscal-printer node — bottom-right -->
  <g filter="url(#soft)" transform="translate(188 188)">
    <rect x="0" y="14" width="64" height="40" rx="6" fill="url(#paper)"/>
    <rect x="6" y="0"  width="52" height="14" rx="3" fill="#fafafa" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="28" x2="54" y2="28" stroke="#9ca3af" stroke-width="1"/>
    <line x1="10" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="56" cy="46" r="3" fill="#22c55e"/>
  </g>

  <!-- Central control core (server/cluster) -->
  <g filter="url(#soft)">
    <circle cx="140" cy="140" r="26" fill="url(#core)"/>
    <circle cx="140" cy="140" r="26" fill="none" stroke="#fde68a" stroke-width="1.5"/>
    <!-- Cluster bars inside the core -->
    <g fill="#312e81">
      <rect x="128" y="130" width="24" height="3" rx="1"/>
      <rect x="128" y="137" width="24" height="3" rx="1"/>
      <rect x="128" y="144" width="24" height="3" rx="1"/>
      <circle cx="148" cy="131.5" r="1.2" fill="#22c55e"/>
      <circle cx="148" cy="138.5" r="1.2" fill="#22c55e"/>
      <circle cx="148" cy="145.5" r="1.2" fill="#22c55e"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="140" y="252" font-family="Inter,system-ui,Helvetica,Arial,sans-serif"
        font-size="20" font-weight="700" text-anchor="middle"
        fill="rgba(255,255,255,0.92)" letter-spacing="3">FLEET</text>
</svg>
